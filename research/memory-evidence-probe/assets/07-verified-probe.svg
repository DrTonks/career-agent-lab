<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="460" viewBox="0 0 2100 460"><rect width="100%" height="100%" fill="white"/>
<rect x="10" y="15" width="395" height="170" rx="12" fill="#edf5f7" stroke="#b5cbd2" stroke-width="2"/>
<text x="28" y="67" font-family="STHeiti, sans-serif" font-size="35" fill="#243c48">生成结论与问题</text>
<text x="28" y="116" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">哪些条件可能使结论失效</text>
<text x="28" y="156" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">模型提出待查问题</text>
<polyline points="407,100 428,100" fill="none" stroke="#557b87" stroke-width="4"/>
<rect x="430" y="15" width="395" height="170" rx="12" fill="#edf5f7" stroke="#b5cbd2" stroke-width="2"/>
<text x="448" y="67" font-family="STHeiti, sans-serif" font-size="35" fill="#243c48">保存持续探针</text>
<text x="448" y="116" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">目标结论／来源／版本</text>
<text x="448" y="156" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">责任角色／待查证据</text>
<polyline points="827,100 848,100" fill="none" stroke="#557b87" stroke-width="4"/>
<rect x="850" y="15" width="395" height="170" rx="12" fill="#edf5f7" stroke="#b5cbd2" stroke-width="2"/>
<text x="868" y="67" font-family="STHeiti, sans-serif" font-size="35" fill="#243c48">变化触发取证</text>
<text x="868" y="116" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">读取真实材料</text>
<text x="868" y="156" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">只派发相关任务</text>
<polyline points="1247,100 1268,100" fill="none" stroke="#557b87" stroke-width="4"/>
<rect x="1270" y="15" width="395" height="170" rx="12" fill="#edf5f7" stroke="#b5cbd2" stroke-width="2"/>
<text x="1288" y="67" font-family="STHeiti, sans-serif" font-size="35" fill="#243c48">演练与业务验证</text>
<text x="1288" y="116" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">变化前后判定是否不同</text>
<text x="1288" y="156" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">假设不改写实际事实</text>
<polyline points="1667,100 1688,100" fill="none" stroke="#557b87" stroke-width="4"/>
<rect x="1690" y="15" width="395" height="170" rx="12" fill="#edf5f7" stroke="#b5cbd2" stroke-width="2"/>
<text x="1708" y="67" font-family="STHeiti, sans-serif" font-size="35" fill="#243c48">局部复核与续办</text>
<text x="1708" y="116" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">相关专家更新产物</text>
<text x="1708" y="156" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">未解决问题继续保留</text>
<polyline points="1900,190 1900,236 615,236 615,190" fill="none" stroke="#557b87" stroke-width="4"/>
<text x="720" y="277" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">有新证据再继续；不把“已提交”当成“已解决”</text>
<text x="55" y="361" font-family="STHeiti, sans-serif" font-size="35" fill="#243c48">当前记忆：结构化数值、判定、版本</text>
<text x="1130" y="361" font-family="STHeiti, sans-serif" font-size="35" fill="#243c48">探针状态：取证、复核提交、问题解决</text>
<text x="55" y="411" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">历史变化仍可解释，关闭检查读取独立当前值</text>
<text x="1130" y="411" font-family="STHeiti, sans-serif" font-size="28" fill="#243c48">当前声明可提交，未通过的预测仍待复核</text>
</svg>